<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      font-family: Arial, sans-serif;
      padding: 15px;
      background-color: #f9f9f9;
    }
    h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
    .option { margin-bottom: 10px; display: flex; align-items: center; }
    .option label { margin-left: 8px; font-size: 14px; cursor: pointer;}
    button {
      width: 100%;
      padding: 10px;
      background-color: #4285F4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover { background-color: #3367D6; }
    #status { font-size: 12px; color: #555; text-align: center; margin-top: 10px; height: 15px;}
  </style>
</head>
<body>
  <h3>Downloader Settings</h3>
  
  <div class="option">
    <input type="checkbox" id="archive" checked>
    <label for="archive">Use Archive (Prevent duplicates)</label>
  </div>

  <div class="option">
    <input type="checkbox" id="no-playlist" checked>
    <label for="no-playlist">No Playlist (Single video only)</label>
  </div>

  <div class="option">
    <input type="checkbox" id="audio-only">
    <label for="audio-only">Audio Only (MP3)</label>
  </div>

  <button id="download-btn">Download Current Tab</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
